<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f4f1e9;font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 10%,#292016 0%,#101012 42%,#050506 100%);display:flex;flex-direction:column;align-items:center}
header{width:100%;text-align:center;padding:42px 18px 20px}
.logo{width:220px;height:220px;max-width:65vw;max-height:65vw;border-radius:50%;object-fit:cover;border:3px solid #c99a43;box-shadow:0 0 0 6px #c99a4322,0 0 38px #c99a4444;background:#090909}
h1{font-size:clamp(34px,8vw,48px);margin:20px 0 4px;font-weight:800;color:#e8c477}
.tagline{margin:0;color:#c6b99f;font-size:14px}
.divider{width:130px;height:1px;background:linear-gradient(90deg,transparent,#c99a43,transparent);margin:23px auto 0}
main{width:min(560px,calc(100% - 34px));padding:12px 0 50px}
.welcome{text-align:center;color:#d0c6b5;font-size:14px;margin:8px 0 24px}
.links{display:grid;gap:16px}
a.button{display:flex;align-items:center;gap:16px;text-decoration:none;color:#f7f2e8;padding:19px 20px;border-radius:17px;border:1px solid #9b7134;background:linear-gradient(110deg,#211a11,#0d0d0e 70%);box-shadow:inset 0 0 18px #c99a4310,0 10px 25px #0008}
.icon{width:48px;height:48px;flex:0 0 48px;border-radius:50%;display:grid;place-items:center;background:#c99a43;color:#17110a;font-size:25px;font-weight:800}
.label strong{display:block;font-size:19px}
.label small{display:block;color:#b9aa90;font-size:12px;margin-top:3px}
.arrow{margin-right:auto;color:#d9b36e;font-size:26px}
footer{color:#776b58;font-size:12px;padding:0 16px 24px}
</style>
</head>
<body>
